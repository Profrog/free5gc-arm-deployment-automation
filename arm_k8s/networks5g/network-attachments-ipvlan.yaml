apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: n2network
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "ipvlan",
    "master": "enp0s6",
    "mode": "l2",
    "mtu": 1450,
    "ipam": {
      "type": "host-local",
      "subnet": "10.10.2.0/24",
      "rangeStart": "10.10.2.10",
      "rangeEnd": "10.10.2.200",
      "gateway": "10.10.2.1"
    }
  }'
---
