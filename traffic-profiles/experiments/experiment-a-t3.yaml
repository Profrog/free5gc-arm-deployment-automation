# experiment-a-t3.yaml — ipvlan 고정, 점진적 트래픽 증가
---
metadata:
  name: "A-T3: ipvlan Fixed + Gradual Ramp-up"
  matrix_id: "A-T3"

nwdaf:
  enabled: false

cni:
  initial: "ipvlan"

phases:
  - name: "steady_low"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate: "10Mbps"
      duration: "22s"

  - name: "gradual_ramp"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate_steps:
        - "30Mbps"
        - "60Mbps"
        - "100Mbps"
        - "150Mbps"
        - "200Mbps"
        - "300Mbps"
      step_duration: "11s"
      duration: "66s"

  - name: "steady_high"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate: "300Mbps"
      duration: "32s"

measurement:
  monitor_interval: 5
  repetitions: 5
