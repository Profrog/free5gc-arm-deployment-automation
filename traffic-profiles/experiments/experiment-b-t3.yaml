# experiment-b-t3.yaml — macvlan 고정, 점진적 트래픽 증가
---
metadata:
  name: "B-T3: macvlan Fixed + Gradual Ramp-up"
  matrix_id: "B-T3"

nwdaf:
  enabled: false

cni:
  initial: "macvlan"

phases:
  - name: "steady_low"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate: "10Mbps"
      duration: "60s"

  - name: "gradual_ramp"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate_steps:
        - "30Mbps"
        - "60Mbps"
        - "100Mbps"
        - "150Mbps"
        - "200Mbps"
        - "300Mbps"
      step_duration: "30s"
      duration: "180s"

  - name: "steady_high"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate: "300Mbps"
      duration: "60s"

measurement:
  monitor_interval: 5
  repetitions: 5
