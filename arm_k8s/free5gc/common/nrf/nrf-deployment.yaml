apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-nrf
  labels:
    app: free5gc
    nf: nrf
spec:
  selector:
    matchLabels:
      app: free5gc
      nf: nrf
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
        nf: nrf
    spec:
      initContainers:
      - name: wait-mongo
        image: arm-curl:curl
        imagePullPolicy: Never
        command: ['sh', '-c', 'until curl -s -o /dev/null mongodb:27017; do echo waiting for MongoDB; sleep 2; done;']
      containers:
      - image: arm-curl:nrf
        imagePullPolicy: Never
        name: nrf
        ports:
        - containerPort: 8000
        command: ["/app/nrf"]
        args: ["--config", "/app/config/nrfcfg.yaml"]
        env: 
          - name: DB_URI
            value: mongodb://mongodb/free5gc
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: /app/config/
          name: nrf-volume
        readinessProbe:
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold:  40
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: nrf-volume
        projected:
          sources:
          - configMap:
              name: nrf-configmap
