# DRANET — Dynamic CNI Backend Switching for free5GC UPF
#
# NWDAF AI 결정 → DRANET 실행 → UPF Pod 네트워크 인터페이스 전환
#
# 설치: kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/dranet/refs/heads/main/install.yaml
# Helm: helm install -n kube-system dranet oci://registry.k8s.io/networking/charts/dranet --version v1.4.0
#
# 요구사항:
#   - Kubernetes v1.32+ (DRA beta) 또는 v1.34+ (DRA GA)
#   - containerd with NRI enabled
#   - DRANET DaemonSet 실행 중

---
# ═══════════════════════════════════════════════════════════
# DeviceClass: 사용 가능한 네트워크 백엔드 정의
# ═══════════════════════════════════════════════════════════

# ipvlan — 저오버헤드 (L2/L3 동일 MAC 공유, 낮은 CPU)
apiVersion: resource.k8s.io/v1beta1
kind: DeviceClass
metadata:
  name: net-ipvlan
spec:
  selectors:
    - cel:
        expression: "device.driver == 'networking.dra.k8s.io'"
    - cel:
        expression: "device.attributes['networking.dra.k8s.io'].type == 'physical'"
  config:
    - opaque:
        driver: networking.dra.k8s.io
        parameters:
          apiVersion: dra.networking.k8s.io/v1alpha1
          kind: NetworkDeviceConfig
          spec:
            interface:
              interfaceType: ipvlan
              mode: l2

---
# macvlan — 고성능 (독립 MAC, 하드웨어 가속 가능, 높은 throughput)
apiVersion: resource.k8s.io/v1beta1
kind: DeviceClass
metadata:
  name: net-macvlan
spec:
  selectors:
    - cel:
        expression: "device.driver == 'networking.dra.k8s.io'"
    - cel:
        expression: "device.attributes['networking.dra.k8s.io'].type == 'physical'"
  config:
    - opaque:
        driver: networking.dra.k8s.io
        parameters:
          apiVersion: dra.networking.k8s.io/v1alpha1
          kind: NetworkDeviceConfig
          spec:
            interface:
              interfaceType: macvlan
              mode: bridge

---
# ═══════════════════════════════════════════════════════════
# ResourceClaim: UPF Pod용 네트워크 리소스 청구
# NWDAF가 이 Claim의 DeviceClass를 변경하여 전환 실행
# ═══════════════════════════════════════════════════════════

apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaim
metadata:
  name: upf-network
  namespace: free5gc
spec:
  devices:
    requests:
      - name: n3-interface
        deviceClassName: net-ipvlan    # ← NWDAF가 이것을 net-macvlan로 변경
      - name: n6-interface
        deviceClassName: net-ipvlan    # ← 동일

---
# ═══════════════════════════════════════════════════════════
# ResourceClaimTemplate: UPF Deployment에서 참조
# ═══════════════════════════════════════════════════════════

apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: upf-network-template
  namespace: free5gc
spec:
  spec:
    devices:
      requests:
        - name: n3-interface
          deviceClassName: net-ipvlan
        - name: n6-interface
          deviceClassName: net-ipvlan
