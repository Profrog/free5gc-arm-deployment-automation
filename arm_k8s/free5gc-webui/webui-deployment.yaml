apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-webui
  labels:
    app: free5gc
    nf: webui
spec:
  selector:
    matchLabels:
      app: free5gc
      nf: webui
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
        nf: webui
    spec:
      initContainers:
      - name: wait-mongo
        image: arm-curl:curl
        imagePullPolicy: Never
        env:
        - name: DEPENDENCIES
          value: mongodb:27017
        command: ["sh", "-c", "until curl -s -o /dev/null http://$DEPENDENCIES; do echo waiting for MongoDB; sleep 2; done;"]
      containers:
      - image: ghcr.io/niloysh/free5gc:v3.2.0
        imagePullPolicy: IfNotPresent
        name: webui
        ports:
        - containerPort: 5000
        command: ["./webui"]
        args: ["--config", "config/webuicfg.yaml"]
        env:
        - name: GIN_MODE
          value: release
        volumeMounts:
        - mountPath: /free5gc/config/
          name: webui-volume
        readinessProbe:
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 40
          successThreshold: 1
          httpGet:
            port: 5000
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: 5000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: webui-volume
        projected:
          sources:
          - configMap:
              name: webui-configmap
