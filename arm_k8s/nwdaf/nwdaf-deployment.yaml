# NWDAF Kubernetes Manifests
# kubectl apply -f arm_k8s/nwdaf/nwdaf-deployment.yaml

---
# ServiceAccount — NWDAF가 kubectl 명령을 실행하기 위해 필요
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nwdaf
  namespace: free5gc

---
# ClusterRole — NWDAF가 필요한 권한:
#   - pods: top, exec (KPI 수집)
#   - resourceclaims: get, patch (DRANET 전환)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nwdaf-role
rules:
  # Pod 조회 및 exec (KPI 수집용)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # metrics-server (kubectl top)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # ResourceClaim 조회/변경 (DRANET 전환)
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "patch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nwdaf-binding
subjects:
  - kind: ServiceAccount
    name: nwdaf
    namespace: free5gc
roleRef:
  kind: ClusterRole
  name: nwdaf-role
  apiGroup: rbac.authorization.k8s.io

---
# ConfigMap — NWDAF 실행 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: nwdaf-config
  namespace: free5gc
data:
  NAMESPACE: "free5gc"
  CLAIM_NAME: "upf-network"
  INTERVAL: "5"
  WINDOW: "5"

---
# Deployment — NWDAF Pod (replicas: 0 = off, 1 = on)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf
  namespace: free5gc
  labels:
    nf: nwdaf
spec:
  replicas: 0  # 기본 OFF — test job에서 scale 1로 켬
  selector:
    matchLabels:
      nf: nwdaf
  template:
    metadata:
      labels:
        nf: nwdaf
    spec:
      serviceAccountName: nwdaf
      containers:
        - name: nwdaf
          image: arm-curl:nwdaf
          imagePullPolicy: Never  # containerd 로컬 이미지
          args:
            - "--interval"
            - "$(INTERVAL)"
            - "--window"
            - "$(WINDOW)"
          envFrom:
            - configMapRef:
                name: nwdaf-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      restartPolicy: Always
