---
# 공정 비교용 NAD: 물리 NIC(enp1s0)에서 직접 분기
# dual-bridge/veth 없이 순수 ipvlan vs macvlan 성능 비교
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: fair-macvlan
  namespace: free5gc
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp1s0",
      "mode": "bridge",
      "mtu": 1500,
      "ipam": {
        "type": "host-local",
        "subnet": "10.10.99.0/24",
        "rangeStart": "10.10.99.1",
        "rangeEnd": "10.10.99.100",
        "gateway": "10.10.99.254"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: fair-ipvlan
  namespace: free5gc
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "ipvlan",
      "master": "enp1s0",
      "mode": "l2",
      "mtu": 1500,
      "ipam": {
        "type": "host-local",
        "subnet": "10.10.99.0/24",
        "rangeStart": "10.10.99.101",
        "rangeEnd": "10.10.99.200",
        "gateway": "10.10.99.254"
      }
    }
