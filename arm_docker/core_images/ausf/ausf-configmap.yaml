apiVersion: v1
kind: ConfigMap
metadata:
  name: ausf-configmap
  labels:
    app: free5gc
data:
  ausfcfg.yaml: |
    info:
      version: 1.0.3
      description: AUSF initial local configuration

    configuration:
      sbi:
        scheme: http
        registerIPv4: ausf-nausf
        bindingIPv4: 0.0.0.0
        port: 8000
      serviceNameList:
        - nausf-auth
      nrfUri: http://nrf-nnrf:8000
      plmnSupportList:
        - mcc: 001
          mnc: 01
      groupId: ausfGroup001
      eapAkaSupiImsiPrefix: false

    logger:
      enable: true
      level: info
      reportCaller: false
