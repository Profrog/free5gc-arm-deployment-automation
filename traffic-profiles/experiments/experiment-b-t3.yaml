# experiment-b-t3.yaml — macvlan 고정, 소→대 전환
---
metadata:
  name: "B-T3: macvlan Fixed + Small→Large"
  matrix_id: "B-T3"

nwdaf:
  enabled: false

cni:
  initial: "macvlan"

phases:
  - name: "small_traffic"
    traffic_pattern:
      protocol: "udp"
      direction: "uplink"
      packet_size: 128
      rate: "10Mbps"
      duration: "120s"

  - name: "large_traffic"
    traffic_pattern:
      protocol: "udp"
      direction: "downlink"
      packet_size: 1400
      rate: "500Mbps"
      duration: "120s"

measurement:
  monitor_interval: 5
  repetitions: 5
