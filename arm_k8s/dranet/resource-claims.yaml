# UPF ResourceClaims — DRANet (v1beta1)
# Format follows DRANet documentation example exactly

---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaim
metadata:
  name: upf-n3
  namespace: free5gc
spec:
  devices:
    requests:
      - name: n3-interface
        deviceClassName: net-ipvlan
        selectors:
          - cel:
              expression: "device.attributes['dra.net'].ifName == 'n3br'"
    config:
      - requests:
          - n3-interface
        opaque:
          driver: dra.net
          parameters:
            interface:
              name: "n3"
              addresses:
                - "10.10.3.1/24"
              mtu: 1450

---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaim
metadata:
  name: upf-n4
  namespace: free5gc
spec:
  devices:
    requests:
      - name: n4-interface
        deviceClassName: net-ipvlan
        selectors:
          - cel:
              expression: "device.attributes['dra.net'].ifName == 'n4br'"
    config:
      - requests:
          - n4-interface
        opaque:
          driver: dra.net
          parameters:
            interface:
              name: "n4"
              addresses:
                - "10.10.4.1/24"
              mtu: 1450
