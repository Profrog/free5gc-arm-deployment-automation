# experiment-a-t2.yaml — ipvlan 고정, 소규모 트래픽
---
metadata:
  name: "A-T2: ipvlan Fixed + Small Traffic"
  matrix_id: "A-T2"

nwdaf:
  enabled: false

cni:
  initial: "ipvlan"

phases:
  - name: "small_traffic"
    traffic_pattern:
      protocol: "udp"
      direction: "uplink"
      packet_size: 128
      rate: "10Mbps"
      duration: "120s"

measurement:
  monitor_interval: 5
  repetitions: 5
